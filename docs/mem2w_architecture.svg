<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#ea580c"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px sans-serif; fill: #475569; }
      .label { font: 600 17px sans-serif; fill: #0f172a; }
      .small { font: 400 14px sans-serif; fill: #334155; }
      .tiny { font: 400 12px sans-serif; fill: #475569; }
      .formula { font: 600 18px monospace; fill: #0f172a; }
      .frozen { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .memory { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
      .param { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .loss { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .orange-line { stroke: #ea580c; stroke-width: 2.5; fill: none; marker-end: url(#arrow-orange); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>
  <text x="70" y="58" class="title">Mem2W in Qwen3.5: persistent-memory residual attention</text>
  <text x="70" y="88" class="subtitle">Implemented path: frozen Qwen3.5 backbone + one trainable memory branch after decoder block 16</text>

  <!-- Backbone -->
  <rect x="70" y="145" width="420" height="470" rx="18" class="frozen"/>
  <text x="100" y="185" class="label">Frozen Qwen3.5 backbone</text>
  <text x="100" y="216" class="small">32 decoder blocks; base weights do not update</text>
  <rect x="115" y="255" width="330" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="291" text-anchor="middle" class="label">Decoder blocks 1–15</text>
  <line x1="280" y1="313" x2="280" y2="354" class="line"/>
  <rect x="115" y="355" width="330" height="70" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="2.5"/>
  <text x="280" y="385" text-anchor="middle" class="label">Decoder block 16</text>
  <text x="280" y="408" text-anchor="middle" class="small">index 15; original weights frozen</text>
  <line x1="280" y1="425" x2="280" y2="466" class="line"/>
  <rect x="115" y="468" width="330" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="504" text-anchor="middle" class="label">Decoder blocks 17–32</text>
  <line x1="445" y1="497" x2="610" y2="497" class="blue-line"/>
  <text x="512" y="481" text-anchor="middle" class="tiny">hidden H</text>

  <!-- Memory module -->
  <rect x="610" y="135" width="680" height="500" rx="18" class="memory"/>
  <text x="645" y="178" class="label">PersistentKVMemory (new branch)</text>
  <text x="645" y="207" class="small">Injected with a forward hook after block 16; residual output is added to H</text>

  <rect x="650" y="245" width="205" height="62" rx="10" class="param"/>
  <text x="752" y="271" text-anchor="middle" class="label">RMSNorm(H)</text>
  <text x="752" y="294" text-anchor="middle" class="tiny">no trainable affine</text>
  <line x1="855" y1="276" x2="925" y2="276" class="line"/>

  <rect x="925" y="225" width="150" height="98" rx="10" class="param"/>
  <text x="1000" y="253" text-anchor="middle" class="label">Q</text>
  <text x="1000" y="278" text-anchor="middle" class="formula">U W_Q</text>
  <text x="1000" y="302" text-anchor="middle" class="tiny">W_Q: d × d_k</text>

  <rect x="925" y="365" width="150" height="98" rx="10" class="param"/>
  <text x="1000" y="393" text-anchor="middle" class="label">K slots</text>
  <text x="1000" y="418" text-anchor="middle" class="formula">K</text>
  <text x="1000" y="442" text-anchor="middle" class="tiny">J × d_k</text>

  <rect x="1100" y="365" width="150" height="98" rx="10" class="param"/>
  <text x="1175" y="393" text-anchor="middle" class="label">V slots</text>
  <text x="1175" y="418" text-anchor="middle" class="formula">V</text>
  <text x="1175" y="442" text-anchor="middle" class="tiny">J × d_v</text>

  <line x1="1000" y1="323" x2="1000" y2="355" class="orange-line"/>
  <line x1="1000" y1="355" x2="1110" y2="355" class="orange-line"/>
  <line x1="1110" y1="355" x2="1110" y2="420" class="orange-line"/>
  <line x1="1075" y1="414" x2="1090" y2="414" class="orange-line"/>
  <line x1="1250" y1="414" x2="1290" y2="414" class="orange-line"/>
  <rect x="1290" y="355" width="250" height="118" rx="10" class="memory"/>
  <text x="1415" y="386" text-anchor="middle" class="label">Persistent attention</text>
  <text x="1415" y="416" text-anchor="middle" class="formula">A = softmax(QKᵀ / √d_k)</text>
  <text x="1415" y="445" text-anchor="middle" class="formula">M = A V</text>

  <line x1="1540" y1="414" x2="1600" y2="414" class="orange-line"/>
  <rect x="1600" y="365" width="145" height="98" rx="10" class="param"/>
  <text x="1672" y="394" text-anchor="middle" class="label">Output</text>
  <text x="1672" y="419" text-anchor="middle" class="formula">M W_O</text>
  <text x="1672" y="443" text-anchor="middle" class="tiny">W_O: d_v × d</text>

  <path d="M1745,414 L1745,555 L730,555 L730,307" class="blue-line"/>
  <text x="1245" y="579" text-anchor="middle" class="small">residual: H′ = H + (A V) W_O</text>

  <!-- Output -->
  <line x1="1290" y1="555" x2="1395" y2="555" class="line"/>
  <rect x="1395" y="515" width="275" height="78" rx="12" class="frozen"/>
  <text x="1532" y="548" text-anchor="middle" class="label">Continue Qwen3.5</text>
  <text x="1532" y="574" text-anchor="middle" class="small">blocks 17–32 → LM head</text>

  <!-- Shapes and distinction -->
  <rect x="70" y="685" width="810" height="350" rx="18" class="note"/>
  <text x="100" y="728" class="label">What this attention is — and is not</text>
  <text x="110" y="770" class="small">• Q comes from every current sequence position H.</text>
  <text x="110" y="800" class="small">• K and V are persistent learned slots, not the prompt’s token KV cache.</text>
  <text x="110" y="830" class="small">• It does not add tokens, a decoder block, RoPE, or a second LM head.</text>
  <text x="110" y="860" class="small">• Padding attention mask gates the residual; assistant loss mask is separate.</text>
  <text x="110" y="900" class="small">• Long sequences are tiled at execution time; tokens are not truncated or compressed.</text>
  <text x="110" y="946" class="formula">4 trainable tensors: W_Q, K, V, W_O</text>
  <text x="110" y="975" class="tiny">For Qwen3.5-4B: d=2560; for Qwen3.5-9B: d=4096; J=512, d_k=d_v=256.</text>

  <!-- Gradient routing -->
  <rect x="930" y="685" width="815" height="350" rx="18" class="note"/>
  <text x="960" y="728" class="label">Training routes implemented</text>
  <rect x="965" y="760" width="340" height="102" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1135" y="795" text-anchor="middle" class="label">W / action stage</text>
  <text x="1135" y="823" text-anchor="middle" class="small">all four: W_Q, K, V, W_O</text>
  <text x="1135" y="846" text-anchor="middle" class="tiny">backbone frozen</text>
  <rect x="1345" y="760" width="340" height="102" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1515" y="795" text-anchor="middle" class="label">C / recall stage</text>
  <text x="1515" y="823" text-anchor="middle" class="small">read path: W_Q, K</text>
  <text x="1515" y="846" text-anchor="middle" class="tiny">V and W_O detached in recall branch</text>
  <text x="965" y="918" class="small">Important initialization constraint:</text>
  <text x="965" y="946" class="small">W_O=0 keeps the original model unchanged at insertion.</text>
  <text x="965" y="974" class="small">Therefore a C-first run with V/W_O detached has zero read-path gradient.</text>
  <text x="965" y="1002" class="formula">valid zero-start schedule: W → C → W</text>

  <text x="70" y="1090" class="tiny">Mem2W implementation snapshot • persistent slots are learned parameters • diagram reflects current ms-swift integration</text>
</svg>
