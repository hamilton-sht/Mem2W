[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem2w"
version = "0.1.0"
description = "Mem2W: a persistent memory layer distilled from MemRL into a frozen Qwen backbone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=5.2.0",
  "datasets>=2.18",
  "pyyaml>=6.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
sft = ["ms-swift>=4.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mem2w-export = "mem2w.teacher_export:main"
mem2w-build-data = "mem2w.build_datasets:main"
mem2w-import-automationbench = "mem2w.raw_automationbench:main"
mem2w-convert-automationbench-0916 = "mem2w.automationbench_0916:main"
mem2w-train = "mem2w.train:main"
mem2w-sft = "mem2w.ms_swift_adapter:main"
mem2w-sft-train = "mem2w.ms_swift_train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
